services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: formly
      POSTGRES_PASSWORD: formly
      POSTGRES_DB: formly
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U formly -d formly']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
